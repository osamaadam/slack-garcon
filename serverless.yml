service: garcon-bot

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-central-1
  iam:
    role:
      statements:
      - Effect: Allow
        Action:
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
        Resource:
        - !GetAtt SlackEventsQueue.Arn
  environment:
    SLACK_BOT_TOKEN: ${env:SLACK_BOT_TOKEN}
    SLACK_SIGNING_SECRET: ${env:SLACK_SIGNING_SECRET}
    LLM_PROVIDER: ${env:LLM_PROVIDER, 'gemini'}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY, ''}
    GEMINI_MODEL: ${env:GEMINI_MODEL, ''}
    GEMINI_FALLBACK_MODELS: ${env:GEMINI_FALLBACK_MODELS, ''}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    OPENAI_MODEL: ${env:OPENAI_MODEL, ''}
    OPENAI_REASONING_EFFORT: ${env:OPENAI_REASONING_EFFORT, ''}
    SYSTEM_PROMPT_FILE: ${env:SYSTEM_PROMPT_FILE, 'system_prompt.txt'}
    EVENTS_QUEUE_URL: !Ref SlackEventsQueue
    NODE_ENV: production

functions:
  # Receiver - responds to Slack immediately
  slack_receiver:
    handler: dist/lambda-receiver.handler
    url: true
    timeout: 10
    memorySize: 128

  # Processor - handles events from queue
  slack_processor:
    handler: dist/lambda-processor.handler
    timeout: 300
    memorySize: 256
    events:
    - sqs:
        arn: !GetAtt SlackEventsQueue.Arn
        batchSize: 1

resources:
  Resources:
    SlackEventsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: garcon-slack-events-${sls:stage}
        VisibilityTimeout: 360 # 6 minutes (longer than Lambda timeout)
        MessageRetentionPeriod: 3600 # 1 hour
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt SlackEventsDlq.Arn
          maxReceiveCount: 3

    SlackEventsDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: garcon-slack-events-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

package:
  patterns:
  - "dist/**"
  - "system_prompt*.txt"
  - "!.git/**"
  - "!.github/**"
  - "!.vscode/**"
  - "!node_modules/@types/**"
  - "!src/**"
  - "!**/*.test.ts"
  - "!**/*.spec.ts"
  - "!tsconfig.json"
  - "!**/*.map"
